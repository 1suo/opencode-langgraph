name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_CONFIG_PROVENANCE: "true"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Compute next version from registry
        run: |
          REGISTRY_VERSION=$(npm view opencode-langgraph version)
          echo "Registry version: ${REGISTRY_VERSION}"
          npm version "${REGISTRY_VERSION}" --allow-same-version --no-git-tag-version
          npm version "${{ inputs.bump }}" --no-git-tag-version
          NEXT_VERSION=$(node -p "require('./package.json').version")
          echo "Next version: ${NEXT_VERSION}"
          echo "NEXT_VERSION=${NEXT_VERSION}" >> "$GITHUB_ENV"

      - name: Check (tsc + vitest)
        run: npm run check

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version and tag
        run: |
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          git add package.json package-lock.json
          git commit -m "release v${NEXT_VERSION} [skip ci]"
          git tag "v${NEXT_VERSION}"
          git push origin main --follow-tags
